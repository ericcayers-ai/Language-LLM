[workspace]
resolver = "2"
members = [
  "crates/media-pipeline",
  "crates/inference-router",
  "crates/subtitle-core",
  "crates/local-store",
  "apps/desktop/src-tauri",
  "packages/protocol/rust",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
language-llm-protocol = { path = "packages/protocol/rust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
