name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm -r --filter "!@language-llm/extension" test
      - run: pnpm --filter @language-llm/extension test
      - run: pnpm -r --filter "!@language-llm/extension" typecheck
      # Combined local entrypoint is `pnpm verify` (pnpm + cargo together).
