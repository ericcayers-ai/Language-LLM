name: Feature request
description: Propose a change that fits local-first and store-safe constraints
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas must respect legal constraints: no YouTube downloaders; store-safe lyrics only.
        See CONTRIBUTING.md, STATUS.md, and docs/architecture. Prefer `@language-llm/ui` density profiles for UI work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior and rough approach
    validations:
      required: true
  - type: checkboxes
    id: legal
    attributes:
      label: Legal fit
      options:
        - label: Does not add YouTube/stream downloading or proprietary lyric scrapers
          required: true
        - label: Stays local-first (no silent cloud inference)
          required: true
        - label: I checked STATUS.md so this is not asking for a Deferred / weights-only feature as if it were already GA
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
