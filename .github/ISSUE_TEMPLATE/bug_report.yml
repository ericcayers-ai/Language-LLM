name: Bug report
description: Report broken behavior in Language-LLM
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Search existing issues first. Attach `pnpm verify` output when relevant.
        Security vulnerabilities: use SECURITY.md (private reporting), not this form.
        Redact bootstrap/session tokens from logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, expected vs actual
      placeholder: |
        1. …
        2. …
        Expected:
        Actual:
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Extension (YouTube / overlay)
        - Extension (page translate)
        - Extension (side panel / learning / dictionaries / privacy)
        - Extension (lyrics)
        - Desktop Tauri manager
        - Companion headless / native messaging / WS
        - Models / digests / OfflineMock
        - Build / verify / CI
        - Docs
        - Other
    validations:
      required: true
  - type: dropdown
    id: expected_maturity
    attributes:
      label: Expected maturity (per STATUS.md)
      description: Helps us tell “bug in implemented path” from “weights/manual gate missing”
      options:
        - Implemented path should work offline without weights
        - Development fallback expected until companion/weights ready
        - Weights-required (CLI + verified digest)
        - Needs manual YouTube / tabCapture verification
        - Unsure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Chrome version, companion mode (serve / Tauri), Node/Rust if relevant
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / verify output
      description: Paste relevant errors (redact tokens)
      render: shell
    validations:
      required: false
