[package]
name = "language-llm-desktop"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "Tauri companion shell (installer, native host, loopback API, desktop manager)"

[lib]
name = "language_llm_desktop"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "language-llm-desktop"
path = "src/main.rs"

[features]
default = []
gui = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-process", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
language-llm-protocol = { workspace = true }
media-pipeline = { path = "../../../crates/media-pipeline" }
inference-router = { path = "../../../crates/inference-router" }
subtitle-core = { path = "../../../crates/subtitle-core" }
local-store = { path = "../../../crates/local-store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = { workspace = true }
