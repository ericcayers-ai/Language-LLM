[package]
name = "language-llm-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tauri companion shell (installer, native host, loopback API)"

[lib]
name = "language_llm_desktop"
path = "src/lib.rs"

[[bin]]
name = "language-llm-desktop"
path = "src/main.rs"

[dependencies]
language-llm-protocol = { workspace = true }
media-pipeline = { path = "../../../crates/media-pipeline" }
inference-router = { path = "../../../crates/inference-router" }
subtitle-core = { path = "../../../crates/subtitle-core" }
local-store = { path = "../../../crates/local-store" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

[dev-dependencies]
tokio = { workspace = true }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = { workspace = true }

